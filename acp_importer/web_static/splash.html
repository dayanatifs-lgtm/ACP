<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>ACP Importer</title>
  <link rel="stylesheet" href="/assets/styles.css?v=19"/>
  <style>
    html, body { margin: 0; min-height: 100%; }
    body.splash-body {
      min-height: 100vh; display: grid; place-items: center; color: #fff;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: radial-gradient(circle at 50% 42%, #4d8fe0 0%, #2367c9 26%, #1a4a94 52%, #0f2348 78%, #0a1628 100%);
    }
    .splash-center { text-align: center; position: relative; z-index: 1; }
    .splash-title { margin: 0; font-size: 56px; font-weight: 800; letter-spacing: .08em; }
    .splash-subtitle { margin: 10px 0 0; font-size: 16px; letter-spacing: .42em; font-weight: 600; }
    .splash-tagline { margin: 18px 0 0; font-size: 14px; color: rgba(255,255,255,.88); }
    .brand-mark {
      width: 78px; height: 78px; margin: 0 auto 22px; border-radius: 22px;
      display: grid; place-items: center;
      background: linear-gradient(145deg, #6aa6eb, #4d8fe0 45%, #2367c9);
      box-shadow: inset 0 -2px 0 rgba(0,0,0,.12);
    }
    .splash-dots { display: flex; justify-content: center; gap: 8px; margin-top: 36px; }
    .splash-dots span { width: 7px; height: 7px; border-radius: 50%; background: #fff; opacity: .7; }
  </style>
</head>
<body class="splash-body">
  <div class="splash-rings" aria-hidden="true"></div>
  <main class="splash-center">
    <div class="brand-mark splash-mark" aria-hidden="true">
      <svg viewBox="0 0 48 48" width="34" height="34" fill="none">
        <ellipse cx="24" cy="12" rx="14" ry="5.5" stroke="#fff" stroke-width="2.2"/>
        <path d="M10 12v8c0 3 6.3 5.5 14 5.5s14-2.5 14-5.5v-8" stroke="#fff" stroke-width="2.2"/>
        <path d="M10 20v8c0 3 6.3 5.5 14 5.5s14-2.5 14-5.5v-8" stroke="#fff" stroke-width="2.2"/>
        <path d="M10 28v8c0 3 6.3 5.5 14 5.5s14-2.5 14-5.5v-8" stroke="#fff" stroke-width="2.2"/>
      </svg>
    </div>
    <h1 class="splash-title">ACP</h1>
    <p class="splash-subtitle">IMPORTER</p>
    <p class="splash-tagline">IFS Delivery Package Import &amp; Analysis</p>
    <div class="splash-dots" aria-hidden="true"><span></span><span></span><span></span></div>
  </main>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const next = params.get("next");
      const target = next && next.startsWith("/") && !next.startsWith("//") && next !== "/"
        ? `/login?next=${encodeURIComponent(next)}`
        : "/login";
      setTimeout(function () { location.replace(target); }, 1800);
    })();
  </script>
</body>
</html>
