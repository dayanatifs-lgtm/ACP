<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Set password · ACP Importer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/assets/styles.css?v=19"/>
</head>
<body class="auth-body auth-body-v2">
  <div class="auth-glow auth-glow-tl" aria-hidden="true"></div>
  <div class="auth-glow auth-glow-br" aria-hidden="true"></div>
  <main class="auth-shell">
    <section class="auth-card-v2">
      <div class="brand-mark auth-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="28" height="28" fill="none">
          <ellipse cx="24" cy="12" rx="14" ry="5.5" stroke="#fff" stroke-width="2.2"/>
          <path d="M10 12v8c0 3 6.3 5.5 14 5.5s14-2.5 14-5.5v-8" stroke="#fff" stroke-width="2.2"/>
          <path d="M10 20v8c0 3 6.3 5.5 14 5.5s14-2.5 14-5.5v-8" stroke="#fff" stroke-width="2.2"/>
          <path d="M10 28v8c0 3 6.3 5.5 14 5.5s14-2.5 14-5.5v-8" stroke="#fff" stroke-width="2.2"/>
        </svg>
      </div>
      <h1 class="auth-brand">ACP IMPORTER</h1>
      <p class="auth-lead" id="title">Set password</p>
      <p class="auth-hint" id="subtitle">Choose a password for your account.</p>
      <form id="set-form" class="auth-form-v2">
        <label>
          <span>Email</span>
          <input id="email" type="email" disabled/>
        </label>
        <label>
          <span>New password</span>
          <input id="password" type="password" required minlength="8" autocomplete="new-password"/>
        </label>
        <label>
          <span>Confirm password</span>
          <input id="confirm" type="password" required minlength="8" autocomplete="new-password"/>
        </label>
        <p id="error" class="error" hidden></p>
        <p id="message" class="success" hidden></p>
        <button class="auth-submit" type="submit">Save password</button>
      </form>
      <p class="auth-links-v2"><a href="/login">Back to sign in</a></p>
      <p class="auth-copy">© 2026 ACP IMPORTER — All rights reserved</p>
    </section>
  </main>
  <script src="/assets/auth.js?v=4"></script>
  <script>
    AuthPage.bindSetPassword();
  </script>
</body>
</html>
